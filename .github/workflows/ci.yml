name: CI

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      - name: Check formatting (black)
        run: uv run black --check src/ tests/

      - name: Lint (flake8)
        run: uv run flake8 src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Build package
        run: uv build

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  tag:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Tag release
        run: .github/scripts/tag-release.sh

  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"

      - uses: oven-sh/setup-bun@v2

      - name: n6k init
        run: uv run n6k init "$RUNNER_TEMP/app"

      - name: Use local n6k
        working-directory: ${{ runner.temp }}/app
        run: uv add --editable "$GITHUB_WORKSPACE"

      - name: Install app dependencies
        working-directory: ${{ runner.temp }}/app
        run: uv sync --all-groups

      - name: Python checks
        working-directory: ${{ runner.temp }}/app
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      - name: Node checks
        working-directory: ${{ runner.temp }}/app
        run: bun run ci

      - name: n6k build
        working-directory: ${{ runner.temp }}/app
        run: uv run n6k build
