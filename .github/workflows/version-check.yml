name: Version check

on:
  pull_request:

jobs:
  unreleased:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail if version already on PyPI
        run: .github/scripts/check-unreleased.sh
