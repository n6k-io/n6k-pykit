name: Version check

on:
  pull_request:

jobs:
  unreleased:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Fail if version already on PyPI
        run: .github/scripts/check-unreleased.sh
