[project]
name = "n6k"
version = "0.10.0"
description = "Arrow/Parquet REST server"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pyarrow>=26",
    "pandas>=3.1",
    "duckdb==1.5.6",
    "n6k-duckdb[mcp]>=0.12",
    "duckdb-virtual-catalog>=0.1.1",
    "python-dotenv>=1.2",
    "mistune>=3.4",
]

[project.optional-dependencies]
# A real psycopg Connection injected into an @rpc (see database.py / connections.py).
# Optional: the DuckDB postgres bridge needs no driver; only raw-Connection rpcs do.
postgres = ["psycopg[binary,pool]>=3.3.6"]

[project.scripts]
n6k = "n6k_app.cli:cli"

[dependency-groups]
dev = [
    "black>=26.10",
    "flake8>=7.5",
    "httpx>=0.28.1",
    "mypy>=2.4",
    "pandas-stubs>=3.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "psycopg[binary,pool]>=3.3.6",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextpy_server", "src/n6k_app"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true


[tool.black]
line-length = 120
target-version = ["py314"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The suite lives in tests/; scratch/ holds throwaway experiments, not tests.
testpaths = ["tests"]
markers = [
    "no_broken: build the test app dir without the deliberately-broken page",
    "exclude_postgres: skip this test on the postgres upstream",
    "exclude_mysql: skip this test on the mysql upstream",
    "xfail_postgres: strict xfail on the postgres upstream",
    "xfail_mysql: strict xfail on the mysql upstream",
]
